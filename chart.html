<!doctype html>
<meta charset="utf-8">
<title>Nautel live channels</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --line: #2b3039;
    --fg: #e6e9ef; --dim: #8b94a5; --accent: #4da3ff;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #fff; --line: #dfe3ea;
      --fg: #1a1d23; --dim: #67707f; --accent: #0a6ed1;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; display: flex; height: 100vh; font: 13px/1.4 ui-sans-serif, system-ui, sans-serif;
    background: var(--bg); color: var(--fg);
  }
  #side {
    width: 300px; flex: none; border-right: 1px solid var(--line);
    display: flex; flex-direction: column; background: var(--panel);
  }
  #side header { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  #side h1 { font-size: 14px; margin: 0 0 8px; font-weight: 600; }
  #status { color: var(--dim); font-size: 12px; }
  #status.live { color: #3ec46d; }
  #filter {
    width: 100%; margin-top: 10px; padding: 6px 8px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  }
  #list { overflow-y: auto; flex: 1; padding: 6px 0; }
  #list label {
    display: flex; gap: 8px; align-items: baseline; padding: 4px 14px; cursor: pointer;
  }
  #list label:hover { background: rgba(127, 127, 127, .12); }
  #list .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #list .units { color: var(--dim); font-size: 11px; }
  #list .live { color: var(--accent); }
  #charts { flex: 1; overflow-y: auto; padding: 14px; display: grid; gap: 14px; align-content: start; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .card h2 { margin: 0; font-size: 12px; font-weight: 600; display: flex; justify-content: space-between; }
  .card .now { font-variant-numeric: tabular-nums; color: var(--accent); }
  .card canvas { width: 100%; height: 130px; display: block; margin-top: 6px; }
  #empty { color: var(--dim); padding: 24px; }
</style>

<div id="side">
  <header>
    <h1>Nautel channels</h1>
    <div id="status">connecting…</div>
    <input id="filter" placeholder="filter channels" autocomplete="off">
  </header>
  <div id="list"></div>
</div>
<div id="charts"><div id="empty">Select channels on the left. Channels receiving data are highlighted.</div></div>

<script>
const MAX_POINTS = 600;
const series = new Map();   // key -> {points: [{t, v}], units, card}
const seen = new Set();     // keys that have produced at least one sample
const selected = new Set();
let channels = [];

const listEl = document.getElementById('list');
const chartsEl = document.getElementById('charts');
const statusEl = document.getElementById('status');
const emptyEl = document.getElementById('empty');

fetch('/api/channels').then(r => r.json()).then(list => {
  channels = list;
  renderList();
});

document.getElementById('filter').addEventListener('input', renderList);

function renderList() {
  const q = document.getElementById('filter').value.toLowerCase();
  listEl.replaceChildren(...channels
    .filter(c => c.key.toLowerCase().includes(q))
    .map(c => {
      const label = document.createElement('label');
      const box = document.createElement('input');
      box.type = 'checkbox';
      box.checked = selected.has(c.key);
      box.addEventListener('change', () => toggle(c, box.checked));
      const name = document.createElement('span');
      name.className = 'name' + (seen.has(c.key) ? ' live' : '');
      name.textContent = c.key;
      const units = document.createElement('span');
      units.className = 'units';
      units.textContent = c.units;
      label.append(box, name, units);
      return label;
    }));
}

function toggle(channel, on) {
  if (on) {
    selected.add(channel.key);
    addCard(channel);
    send({op: 'subscribe', keys: [...selected]});
  } else {
    selected.delete(channel.key);
    series.get(channel.key)?.card.remove();
    series.delete(channel.key);
  }
  emptyEl.style.display = selected.size ? 'none' : '';
}

function addCard(channel) {
  const card = document.createElement('div');
  card.className = 'card';
  const h2 = document.createElement('h2');
  const title = document.createElement('span');
  title.textContent = channel.key;
  const now = document.createElement('span');
  now.className = 'now';
  now.textContent = '—';
  h2.append(title, now);
  const canvas = document.createElement('canvas');
  card.append(h2, canvas);
  chartsEl.append(card);
  series.set(channel.key, {points: [], units: channel.units, card, canvas, now});
}

function draw(entry) {
  const {canvas, points, units, now} = entry;
  const dpr = devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w * dpr) { canvas.width = w * dpr; canvas.height = h * dpr; }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  if (!points.length) return;

  const css = getComputedStyle(document.documentElement);
  const values = points.map(p => p.v);
  let lo = Math.min(...values), hi = Math.max(...values);
  if (hi - lo < 1e-9) { hi += 1; lo -= 1; }
  const pad = (hi - lo) * 0.12;
  lo -= pad; hi += pad;
  const t0 = points[0].t, t1 = points[points.length - 1].t || t0 + 1;
  const x = t => 40 + (w - 48) * (t1 === t0 ? 1 : (t - t0) / (t1 - t0));
  const y = v => h - 16 - (h - 26) * (v - lo) / (hi - lo);

  ctx.strokeStyle = css.getPropertyValue('--line');
  ctx.fillStyle = css.getPropertyValue('--dim');
  ctx.font = '10px ui-sans-serif, system-ui, sans-serif';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 2; i++) {
    const v = lo + (hi - lo) * i / 2;
    ctx.beginPath(); ctx.moveTo(40, y(v)); ctx.lineTo(w - 8, y(v)); ctx.stroke();
    ctx.fillText(fmt(v), 2, y(v) + 3);
  }

  ctx.strokeStyle = css.getPropertyValue('--accent');
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  points.forEach((p, i) => i ? ctx.lineTo(x(p.t), y(p.v)) : ctx.moveTo(x(p.t), y(p.v)));
  ctx.stroke();

  const last = points[points.length - 1].v;
  now.textContent = `${fmt(last)} ${units}`;
}

function fmt(v) {
  const a = Math.abs(v);
  return a >= 1000 ? v.toFixed(0) : a >= 10 ? v.toFixed(1) : v.toFixed(3);
}

let socket, redrawQueued = false;
function connect() {
  socket = new WebSocket(`ws://${location.host}/ws`);
  socket.onopen = () => {
    statusEl.textContent = 'live';
    statusEl.className = 'live';
    if (selected.size) send({op: 'subscribe', keys: [...selected]});
  };
  socket.onclose = () => {
    statusEl.textContent = 'disconnected — retrying';
    statusEl.className = '';
    setTimeout(connect, 2000);
  };
  socket.onmessage = ev => {
    const {k, t, v} = JSON.parse(ev.data);
    if (!seen.has(k)) { seen.add(k); renderList(); }
    const entry = series.get(k);
    if (!entry) return;
    entry.points.push({t, v});
    if (entry.points.length > MAX_POINTS) entry.points.shift();
    if (!redrawQueued) {
      redrawQueued = true;
      requestAnimationFrame(() => { redrawQueued = false; series.forEach(draw); });
    }
  };
}

function send(obj) {
  if (socket?.readyState === 1) socket.send(JSON.stringify(obj));
}

addEventListener('resize', () => series.forEach(draw));
connect();
</script>
